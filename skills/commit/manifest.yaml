id: commit
version: 1.0.0
category: configurable
description: Commits staged or all current changes following Conventional Commits and project conventions. User-invocable via /commit or /commit -m "message".
placeholders:
  - key: PROJECT_NAME
    description: Project name used in the commit assistant persona
    default: "the project"
triggers:
  en:
    - "commit changes"
    - "create a commit"
  uk:
    - "закоміть"
    - "зроби коміт"
