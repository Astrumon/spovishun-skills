id: compose-multiplatform
version: 1.1.0
category: stack-specific
requires:
  - kotlin
  - kmp
description: Compose Multiplatform UI mechanics — remember keying, cross-phase back-writing, the modifier API contract, lazy-list keys and prefetch, the stability/phase model behind unwanted recomposition, and gating stability in CI. Design-system boundaries stay in rules/kmp/uikit.md.
provides:
  - Compose state and effect keying
  - Modifier API contract
  - Recomposition diagnosis
  - Stability regression gating
