id: finish-task
version: 1.0.0
category: universal
description: Runs the task-completion gate — tests → build → lint (blocking) — then a code-reviewer pass on the task diff (advisory), before offering push / PR / Notion Done. Never auto-merges or auto-completes.
placeholders:
  - key: PROJECT_PREFIX
    description: Project branch prefix used in task numbering (e.g. myproject)
  - key: GIT_DEVELOP_BRANCH
    description: Base branch the task diff is computed against (default develop)
triggers:
  en:
    - "finish task"
    - "complete task"
    - "task done"
    - "mark task complete"
  uk:
    - "завершити задачу"
    - "закінчити задачу"
    - "задача готова"
