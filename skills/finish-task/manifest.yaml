id: finish-task
version: 1.3.0
category: universal
description: Runs the task-completion gate — an optional comment-hygiene pass, then tests → build → lint (blocking) — then an advisory review with domain specialists picked from the diff, and a plain-language summary in the project language. Never auto-merges or auto-completes.
placeholders:
  - key: PROJECT_PREFIX
    description: Project branch prefix used in task numbering (e.g. myproject)
  - key: GIT_DEVELOP_BRANCH
    description: Base branch the task diff is computed against (default develop)
  - key: PROJECT_LANGUAGE
    description: Language for the closing summary (e.g. "uk", "en"). Comes from project.language in the consumer config.
triggers:
  en:
    - "finish task"
    - "complete task"
    - "task done"
    - "mark task complete"
  uk:
    - "завершити задачу"
    - "закінчити задачу"
    - "задача готова"
