id: grill-me
version: 1.0.0
category: universal
description: Interviews the user one question at a time about a plan or design, walking the decision tree until shared understanding is reached. Provides a recommended answer for each question.
triggers:
  en:
    - "grill me"
    - "stress-test my plan"
    - "challenge my design"
    - "stress test"
  uk:
    - "загартуй мене"
    - "перевір мій план"
    - "постав мені питання"
    - "допити мене"
