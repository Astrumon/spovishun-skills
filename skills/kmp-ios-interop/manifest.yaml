id: kmp-ios-interop
version: 1.0.0
category: stack-specific
requires:
  - kotlin
  - kmp
description: The Kotlin-to-Swift boundary of a KMP module — naming, type-width and nullability bridging, SKIE suspend-to-async and Flow-to-AsyncSequence, sealed-class exhaustiveness, keeping the ObjC header small, and embedding SwiftUI in Compose. Stops immediately if the project declares no iOS target.
provides:
  - Kotlin/Swift boundary design
  - SKIE bridging guidance
  - SwiftUI embedding in Compose
