id: kmp-testing
version: 1.0.0
category: stack-specific
requires:
  - kotlin
  - kmp
description: Testing technique for Kotlin Multiplatform — the test-first loop, Compose test dispatching and the two-schedulers trap, semantics-first selectors, choosing the smallest test shape, test clock vs wall clock, and animation/screenshot determinism. Supersedes unit-testing-kotlin in KMP projects.
provides:
  - Compose test dispatching and determinism
  - Test shape selection
  - KMP test diagnosis
triggers:
  en:
    - "commonTest"
    - "runComposeUiTest"
    - "StandardTestDispatcher"
    - "androidDeviceTest"
    - "mainClock"
    - "flaky compose test"
    - "onNodeWithText"
    - "advanceUntilIdle"
  uk:
    - "тести в commonTest"
    - "Compose UI тест"
    - "флакі тест"
    - "тестовий диспетчер"
    - "мультиплатформенні тести"
