id: koin-kmp
version: 1.0.0
category: stack-specific
requires:
  - kotlin
  - kmp
description: Koin wiring for Kotlin Multiplatform — expect val platformModule, per-target dispatcher and engine bindings, koinViewModel vs koinInject in Compose, scopes, Classic DSL vs KSP annotations, and checkModules() verification. Supersedes dependency-injection-architecture in KMP projects.
