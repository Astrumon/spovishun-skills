  - kmp
description: Ktor HTTP client configuration in a KMP project — plugin install order (HttpRequestRetry before HttpTimeout), the encodeDefaults trap, one expectSuccess model, bearer refresh with markAsRefreshTokenRequest, WebSocket/SSE converters, and MockEngine testing.
