id: new-feature
version: 1.1.0
category: stack-specific
requires:
  - kotlin
  - kmp
user_invocable: true
description: Scaffolds a Compose Multiplatform feature as an api/impl Gradle module pair — NavKey, MVI screen (UiState/Intent/Effect), ViewModel, feature-owned Navigation 3 entry builder, Koin module, strings and a test. Falls back to NavGraphBuilder on Nav 2. User-invocable via /new-feature <Name>.
provides:
  - KMP feature module scaffolding
triggers:
  en:
    - "new feature module"
    - "scaffold a feature"
    - "add a new screen"
    - "create a screen"
    - "new KMP feature"
  uk:
    - "нова фіча"
    - "створи екран"
    - "додай екран"
    - "згенеруй фічу"
    - "новий модуль фічі"
