id: newtask
version: 1.2.0
category: stack-specific
requires:
  - notion
description: Creates a new task on the project Notion board and prepares the corresponding git branch. Covers task numbering (get-board.js --next-number), branch naming, epic linking, blocker wiring, optional Type/Appetite/Repo, and the task format v2 page body defined in templates/task-page.
placeholders:
  - key: NOTION_CLAUDE_MD_PAGE_ID
    description: Notion page ID of the CLAUDE.md page to fetch project context
  - key: PROJECT_PREFIX
    description: Project branch prefix used in task numbering (e.g. myproject)
  - key: GIT_DEVELOP_BRANCH
    description: Name of the development base branch (e.g. develop or main)
triggers:
  en:
    - "new task"
    - "create task"
    - "add task"
  uk:
    - "нова задача"
    - "створи задачу"
    - "додай таск"
    - "нова таска"
