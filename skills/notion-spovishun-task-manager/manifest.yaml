id: notion-spovishun-task-manager
version: 1.1.0
category: stack-specific
requires:
  - notion
description: Project-specific Notion task manager. Covers task numbering, branch naming, epic linking, board reading via CLI scripts, status updates via MCP, and auto-doc update on task completion.
placeholders:
  - key: PROJECT_PREFIX
    description: Project branch prefix used in task numbering (e.g. myproject)
  - key: GIT_DEVELOP_BRANCH
    description: Name of the development base branch (e.g. develop or main)
triggers:
  en:
    - "task board"
    - "update task status"
    - "what's in progress"
    - "show board"
    - "sprint planning"
  uk:
    - "задача"
    - "борд"
    - "спринт"
    - "створи задачу"
    - "що в борді"
    - "закрий задачу"
    - "переведи в done"
