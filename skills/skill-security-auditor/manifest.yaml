id: skill-security-auditor
version: 1.0.0
category: universal
description: Quality gate for new or modified Claude Code skills. Reviews a SKILL.md against a 7-point checklist (frontmatter, triggers, workflow clarity, scope guard, error handling, cross-references, test coverage) and produces a PASS/FAIL report.
triggers:
  en:
    - "audit this skill"
    - "review this skill"
    - "check this skill"
    - "skill ready to add?"
    - "is this skill good?"
  uk:
    - "перевір скіл"
    - "аудит скіла"
