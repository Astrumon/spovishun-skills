id: update-doc-full
version: 1.0.0
category: stack-specific
requires:
  - notion
description: Orchestrated documentation sync. Audits committed git changes over a time range (1w/2w/1m/3m/1y), delegates zone mapping to a doc-updater subagent, presents proposed Notion updates in plannotator for batch confirmation, then applies approved updates via MCP.
triggers:
  en:
    - "update docs"
    - "sync notion"
    - "sync docs"
  uk:
    - "оновити документацію"
    - "синхронізувати документацію"
